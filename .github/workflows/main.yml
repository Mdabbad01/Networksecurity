name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.11

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: |
          echo "No tests yet"

  docker-build-and-push:
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push Docker image
        env:
          ECR_URI: ${{ secrets.ECR_URI }}
          IMAGE_TAG: latest
        run: |
          echo "Building Docker image..."
          docker build -t networksecurity:$IMAGE_TAG .
          echo "Tagging Docker image..."
          docker tag networksecurity:$IMAGE_TAG $ECR_URI:$IMAGE_TAG
          echo "Pushing Docker image to ECR..."
          docker push $ECR_URI:$IMAGE_TAG

  continuous-deployment:
    runs-on: ubuntu-latest
    needs: docker-build-and-push

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Deploy Docker container to EC2 via SSM
        env:
          ECR_URI: ${{ secrets.ECR_URI }}
          IMAGE_TAG: latest
        run: |
          echo "Deploying Docker container to EC2 instance 'Networksecurity' via SSM..."
          aws ssm send-command \
            --targets "Key=tag:Name,Values=Networksecurity" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy Docker container" \
            --parameters commands='[
              "docker pull ${ECR_URI}:${IMAGE_TAG}",
              "docker stop networksecurity || true",
              "docker rm networksecurity || true",
              "docker run -d --name networksecurity -p 80:80 ${ECR_URI}:${IMAGE_TAG}"
            ]' \
            --region ${{ secrets.AWS_REGION }}
